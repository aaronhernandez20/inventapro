<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button aria-label="Abrir menú"></ion-menu-button>
    </ion-buttons>
    <ion-title>Productos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <main>
    <h1>Inventario</h1>

    @if (cargando()) {
      <div class="centro"><ion-spinner aria-label="Cargando productos"></ion-spinner></div>
    } @else if (error()) {
      <ion-text color="danger"><p role="alert">{{ error() }}</p></ion-text>
    } @else {
      <ion-list>
        @for (p of productos(); track p.id) {
          <ion-item>
            <ion-label>
              <h2>{{ p.nombre }}</h2>
              <p>{{ p.sku }} · {{ p.categorias?.nombre ?? 'Sin categoría' }} · {{ p.precio | currency: 'EUR' }}</p>
            </ion-label>
            <div slot="end" class="stock">
              <ion-note>Stock</ion-note>
              <ion-badge [color]="p.stock <= p.stock_minimo ? 'danger' : 'success'"
                         [attr.aria-label]="'Stock ' + p.stock + (p.stock <= p.stock_minimo ? ', bajo mínimo' : '')">
                {{ p.stock }}
              </ion-badge>
            </div>
          </ion-item>
        } @empty {
          <ion-item><ion-label>No hay productos.</ion-label></ion-item>
        }
      </ion-list>
    }
  </main>
</ion-content>
