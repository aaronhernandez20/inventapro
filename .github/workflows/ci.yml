# Integración continua: en cada push y Pull Request a main/develop
# se instalan dependencias, se pasan los tests unitarios y se compila para producción.
# Si algo falla, el PR aparece en rojo y no debe unirse (Vercel tampoco despliega,
# porque su comando de build también ejecuta los tests).
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-y-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tests unitarios (Vitest)
        run: npm run test:ci

      - name: Compilar para producción + documentación (Compodoc)
        run: npx ng build && npm run docs

      - name: Guardar la documentación generada
        uses: actions/upload-artifact@v4
        with:
          name: documentacion-tecnica
          path: www/docs
